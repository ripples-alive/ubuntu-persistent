services:
  ubuntu:
    image: registry.dqwang.space/ripples/ubuntu-persistent:24.04
    build: .
    ports:
      - 10022:22
    environment:
      SSH_PUBKEY: ${SSH_PUBKEY}
    volumes:
      - ./data:/data
      - ./data/etc:/etc
      - ./data/home:/home
      - ./data/opt:/opt
      - ./data/root:/root
      - ./data/usr:/usr
      - ./data/var:/var
